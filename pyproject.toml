[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workzilla-bot"
version = "0.1.0"
description = "Minimal async client for Workzilla"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "shared_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
